services:
  client:
    build:
      context: ./client
      target: development
    volumes:
      - ./client:/app
      - /app/apps/web/.next
    command: [ "npm", "run", "dev" ]
  server:
    build:
      context: ./server
      target: development
    volumes:
      - ./server:/app

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - client
